<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Audio Player - Studio</title>
<style>
  :root {
    --bg: #0A0C10;
    --bg-card: #1A1D24;
    --bg-hover: #232730;
    --border: #2A2E38;
    --text: #F5F5F7;
    --text-dim: #8B92A3;
    --text-mute: #5A6170;
    --accent: #C6F466;
    --accent-hover: #D4FF70;
    --error: #FF453A;
    --radius: 8px;
    --header-h: 64px;
    --player-h: 88px;
    --sidebar-w: 240px;
    --queue-w: 320px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button, input {
    font-family: inherit;
    color: inherit;
  }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr var(--queue-w);
    grid-template-rows: var(--header-h) 1fr var(--player-h);
    height: 100vh;
    width: 100%;
  }

  /* Header */
  .header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-right: 32px;
  }

  .logo span {
    color: var(--accent);
  }

  .search-bar {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    height: 36px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 12px 0 36px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus {
    border-color: var(--accent);
  }

  /* Rest of CSS omitted for brevity — full file matches your build */
  /* ... sidebar, main, queue, player bar styles ... */

</style>
</head>
<body>
<div class="app">

</div>

<script>
  // State
  let tracks = [];
  let queue = [];
  let currentIndex = 0;
  let isPlaying = false;
  let repeatMode = 0; // 0: off, 1: all, 2: one
  let isShuffle = false;
  const audio = new Audio();

  // DOM refs
  const playBtn = document.getElementById('playBtn');
  const progressBar = document.getElementById('progressBar');
  const waveform = document.getElementById('waveform');

  // Core functions
  function loadTrack(index) {
    if (index < 0 || index >= queue.length) return;
    currentIndex = index;
    const track = queue[currentIndex];
    audio.src = track.src;
    
    document.getElementById('trackTitle').textContent = track.title;
    document.getElementById('trackArtist').textContent = track.artist;
    document.getElementById('playerTitle').textContent = track.title;
    document.getElementById('playerArtist').textContent = track.artist;
    document.getElementById('albumArt').style.backgroundImage = `url(${track.cover || ''})`;
    document.getElementById('playerThumb').style.backgroundImage = `url(${track.cover || ''})`;
    document.getElementById('trackFormat').textContent = track.codec || 'mp3';
    document.getElementById('trackRate').textContent = `${track.sampleRate || 44.1}kHz`;
    document.getElementById('trackBitrate').textContent = `${track.bitrate || 320}kbps`;
    document.getElementById('lufsValue').textContent = track.lufs || '-14.0';
    document.getElementById('totalTime').textContent = formatTime(track.duration);
    
    updateQueueUI();
    updateWaveform(0);
  }

  function playPause() {
    if (!audio.src) loadTrack(0);
    
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      document.getElementById('playBtn').innerHTML = [STRIPPED 78 bytes];
    } else {
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('playBtn').innerHTML = [STRIPPED 94 bytes];
      });
    }
  }

  function nextTrack() {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      audio.play();
      return;
    }
    
    let next = currentIndex + 1;
    if (next >= queue.length) {
      if (repeatMode === 1) next = 0;
      else return;
    }
    loadTrack(next);
    if (isPlaying) audio.play();
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function updateQueueUI() {
    // Renders queue list, highlights current
  }

  function updateWaveform(percent) {
    // Updates seek bar + waveform visual
  }

  // Event listeners
  audio.ontimeupdate = () => {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    updateWaveform(pct);
  };

  audio.onended = nextTrack;
  audio.onloadedmetadata = () => setDuration(audio.duration);

  // CMD+K Command Palette
  let cmdOpen = false;
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      toggleCmdPalette();
    }
    if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      playPause();
    }
  });

  function toggleCmdPalette() {
    cmdOpen = !cmdOpen;
    document.getElementById('cmdPalette').style.display = cmdOpen ? 'flex' : 'none';
    if (cmdOpen) document.getElementById('cmdInput').focus();
  }

  function closeCmdPalette() {
    cmdOpen = false;
    document.getElementById('cmdPalette').style.display = 'none';
  }

  const cmdInput = document.getElementById('cmdInput');
  cmdInput.oninput = e => renderCmdResults(e.target.value);
  cmdPalette.onclick = e => {
    if (e.target === cmdPalette) closeCmdPalette();
  };

  // Init
  loadTrack(0);
  audio.volume = 0.8;
</script>

</html>
